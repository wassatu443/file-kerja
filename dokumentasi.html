<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Galeri Dokumentasi</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      background: #f4f4f4;
    }
    h1 {
      margin-top: 20px;
    }
    .gallery {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
      padding: 20px;
    }
    .gallery img {
      width: 250px;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      transition: transform 0.3s ease;
    }
    .gallery img:hover {
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <h1>📸 Dokumentasi Acak</h1>
  <div class="gallery" id="gallery"></div>

  <script>
    const totalImages = 32; // Jumlah gambar
    const imageList = [];

    for (let i = 1; i <= totalImages; i++) {
      imageList.push(`Image/1 (${i}).jpeg`); // Perhatikan huruf besar 'Image'
    }

    // Acak urutan gambar
    imageList.sort(() => Math.random() - 0.5);

    // Tampilkan gambar
    const gallery = document.getElementById("gallery");
    imageList.forEach(src => {
      const img = document.createElement("img");
      img.src = src;
      img.alt = "Dokumentasi";
      gallery.appendChild(img);
    });
  </script>
</body>
</html>
