<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Slideshow Dokumentasi</title>
  <style>
    body {
      font-family: sans-serif;
      background-color: #000;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      position: relative;
    }

    .slideshow-container {
      position: relative;
      width: 80%;
      max-width: 800px;
      height: auto;
    }

    .slideshow-container img {
      width: 100%;
      height: auto;
      border-radius: 10px;
      position: absolute;
      opacity: 0;
      transition: opacity 1s ease-in-out;
    }

    .slideshow-container img.active {
      opacity: 1;
      z-index: 1;
    }

    /* Tombol Home */
    .home-button {
      position: absolute;
      top: 20px;
      left: 20px;
      background-color: #ffffffcc;
      color: #000;
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      text-decoration: none;
      font-weight: bold;
      transition: background-color 0.3s ease;
      z-index: 999;
    }

    .home-button:hover {
      background-color: #ddd;
    }
  </style>
</head>
<body>

  <!-- Tombol Home -->
  <a href="index.html" class="home-button">🏠 Home</a>

  <div class="slideshow-container" id="slideshow"></div>

  <script>
    const totalImages = 47; // jumlah file, tanpa perlu tahu ekstensi
    const baseNames = [];

    for (let i = 1; i <= totalImages; i++) {
      baseNames.push(`Image/1 (${i})`);
    }

    const container = document.getElementById('slideshow');
    const images = [];
    let loadedCount = 0;

    function tryLoadImage(baseName, callback) {
      const img = new Image();
      img.src = `${baseName}.jpeg`;
      img.onload = () => callback(img);
      img.onerror = () => {
        img.src = `${baseName}.jpg`;
        img.onload = () => callback(img);
        img.onerror = () => {
          console.warn(`Gagal memuat: ${baseName}.jpeg dan .jpg`);
        };
      };
    }

    baseNames.sort(() => Math.random() - 0.5); // acak urutan

baseNames.forEach((baseName) => {
      tryLoadImage(baseName, img => {
        if (images.length === 0) img.classList.add('active'); // gambar pertama
        container.appendChild(img);
        images.push(img);
        loadedCount++;

        if (loadedCount === baseNames.length) {
          let current = 0;
          setInterval(() => {
            images[current].classList.remove('active');
            current = (current + 1) % images.length;
            images[current].classList.add('active');
          }, 3000);
        }
      });
    });
  </script>
</body>
</html>
